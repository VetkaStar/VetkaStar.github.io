name: Publish VETKA applications
on:
  workflow_dispatch:
  push:
    paths:
      - 'vels/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Gridfinity source
        uses: actions/checkout@v4
        with:
          repository: VetkaStar/vetka-gridfinity-plus
          path: gridfinity-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Gridfinity
        run: |
          cd gridfinity-source
          python build_release.py --with-landing --output dist/site
          mkdir -p ../public/gridfinity-plus
          cp -a dist/site/. ../public/gridfinity-plus/
      - name: Prepare site
        run: |
          cp index.html public/index.html
          mkdir -p public/vels
          cp vels/index.html public/vels/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
