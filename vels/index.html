<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ProcureAI - планирование закупок</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23d9f2b3%22%2F%3E%3Cpath%20d%3D%22M12%2051V25l14-10%2014%2010v26M40%2034l12-8v25M12%2051h40%22%20fill%3D%22none%22%20stroke%3D%22%23163c32%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    iframe { display: block; }
  </style>
</head>
<body>
  <iframe id="app" title="ProcureAI - планирование закупок"></iframe>
  <noscript>Для работы приложения включите JavaScript.</noscript>
  <script>
    (function () {
      'use strict';
      const child = 'https://vels-vetkastar.tw1.ru';
      const frame = document.getElementById('app');
      let pendingHash = location.hash;
      let restorePending = !!pendingHash;

      function destination() {
        const run = new URLSearchParams(location.search).get('run') || '';
        const safe = /^[0-9TZ-]+[a-f0-9]{10}$/.test(run) ? '?run=' + encodeURIComponent(run) : '';
        return child + '/' + safe + location.hash;
      }
      frame.src = destination();

      window.addEventListener('message', function (event) {
        if (event.origin !== child || event.source !== frame.contentWindow || !event.data || event.data.type !== 'procureai-location') return;
        if (event.data.login) return;
        if (restorePending && !event.data.ready) return;
        if (restorePending) {
          restorePending = false;
          if (event.data.hash !== pendingHash) {
            frame.contentWindow.postMessage({type: 'procureai-restore', hash: pendingHash}, child);
            return;
          }
        }
        const run = typeof event.data.run === 'string' && /^[0-9TZ-]+[a-f0-9]{10}$/.test(event.data.run)
          ? '?run=' + encodeURIComponent(event.data.run) : '';
        const hash = typeof event.data.hash === 'string' && event.data.hash.startsWith('#') &&
          event.data.hash.length <= 2048 && !/[\x00-\x1f\x7f]/.test(event.data.hash) ? event.data.hash : '';
        const path = '/vels/' + run + hash;
        if (location.pathname + location.search + location.hash !== path) history.replaceState(null, '', path);
      });

      window.addEventListener('popstate', function () {
        pendingHash = location.hash;
        restorePending = !!pendingHash;
        frame.src = destination();
      });
    })();
  </script>
</body>
</html>
